name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck gettext locales

      - name: Generate the French locale
        run: sudo locale-gen fr_FR.UTF-8

      - name: Build the catalogues
        run: tools/build-locales.sh

      - name: Run shellcheck
        run: shellcheck euromillions.sh .githooks/commit-msg tools/build-locales.sh

      - name: Run the test suite
        run: bats test test/shell

  package-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats build-essential debhelper gettext shellcheck

      - name: Build the Debian package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          cp ../euromillions_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  package-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install the packaging tools
        run: dnf install -y git tar gzip rpm-build gettext

      - uses: actions/checkout@v5

      - name: Build the RPM
        run: |
          mkdir -p dist rpmbuild/SOURCES
          version=1.0.0
          git archive --format=tar.gz --prefix="euromillions-$version/" \
            --output="rpmbuild/SOURCES/euromillions-$version.tar.gz" HEAD
          rpmbuild -bb packaging/rpm/euromillions.spec --define "_topdir $PWD/rpmbuild"
          cp rpmbuild/RPMS/noarch/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

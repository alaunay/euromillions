<text x="46" y="72" fill="#e6edf3">./euromillions.sh</text>
</g>
<rect x="46" y="59" width="8" height="19" fill="#e6edf3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0044;0.2098;1" dur="11.371s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="x" values="46;46;199.0;199.0" keyTimes="0;0.0308;0.113;1" dur="11.371s" repeatCount="indefinite"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.1262" dur="11.371s" repeatCount="indefinite" calcMode="discrete"/>
<text x="28" y="100" fill="#9aa4b2">Numbers:</text>
<text x="112" y="100" fill="#4d6bff">4 8 13 36 46</text>
</g>

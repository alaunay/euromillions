<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img" aria-labelledby="title desc">
	<title id="title">Terminal session running euromillions.sh</title>
	<desc id="desc">The command ./euromillions.sh prints five numbers and two stars, then ./euromillions.sh --lang fr prints the same draw in French.</desc>

	<defs>
		<clipPath id="window">
			<rect x="0" y="0" width="720" height="306" rx="12" ry="12"/>
		</clipPath>
	</defs>

	<g clip-path="url(#window)">
		<rect width="720" height="306" fill="#0d1117"/>

		<!-- Title bar -->
		<rect width="720" height="40" fill="#161b22"/>
		<circle cx="24" cy="20" r="6" fill="#ff5f56"/>
		<circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
		<circle cx="64" cy="20" r="6" fill="#27c93f"/>
		<text x="360" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">euromillions</text>

		<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
			<!-- Prompt 1 -->
			<text x="28" y="78" fill="#3fb950">$</text>
			<text x="46" y="78" fill="#c9d1d9">./euromillions.sh</text>

			<!-- Output 1 -->
			<text x="28" y="106" fill="#8b949e">Numbers:</text>
			<text x="112" y="106" fill="#58a6ff">4 8 13 36 46</text>
			<text x="28" y="134" fill="#8b949e">Stars:</text>
			<text x="112" y="134" fill="#d2a8ff">3 12</text>

			<!-- Prompt 2 -->
			<text x="28" y="190" fill="#3fb950">$</text>
			<text x="46" y="190" fill="#c9d1d9">./euromillions.sh --lang fr</text>

			<!-- Output 2 -->
			<text x="28" y="218" fill="#8b949e">Numéros:</text>
			<text x="112" y="218" fill="#58a6ff">17 19 20 27 48</text>
			<text x="28" y="246" fill="#8b949e">Étoiles:</text>
			<text x="112" y="246" fill="#d2a8ff">5 12</text>
		</g>
	</g>
</svg>

name: pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, such as v0.0.1"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern "*.deb" --pattern "*.rpm"

      - name: Install the repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c dpkg-dev gnupg rpm

      - name: Import the signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$REPO_GPG_PRIVATE_KEY" ]; then
            echo "REPO_GPG_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          printf '%s\n' "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build the repositories
        env:
          REPO_GPG_KEY_ID: ${{ secrets.REPO_GPG_KEY_ID }}
          REPO_ORIGIN: euromillions
          REPO_LABEL: euromillions
          REPO_NAME: euromillions
          REPO_BASE_URL: https://alaunay.github.io/euromillions
        run: tools/build-repo.sh dist site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment

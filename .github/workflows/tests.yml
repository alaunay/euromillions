name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    name: bats / ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      REQUIRE_TRANSLATION: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: ubuntu-26.04
            image: ubuntu:26.04
          - name: debian-12
            image: debian:12
          - name: debian-13
            image: debian:13
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the tools
        run: |
          apt-get update -qq
          apt-get install -y -qq bats gettext git locales python3 shellcheck

      - name: Generate the French locale
        run: localedef -i fr_FR -f UTF-8 fr_FR.UTF-8

      - name: Build the catalogues
        run: tools/build-locales.sh

      - name: Validate the metadata and the tools
        run: |
          python3 tools/check-metadata.py
          python3 -m py_compile tools/changelog.py tools/shellcheck-sarif.py

      - name: Run shellcheck
        run: shellcheck euromillions.sh .githooks/commit-msg tools/build-locales.sh

      - name: Run the test suite
        run: bats test test/shell

  markdown:
    name: markdown
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md

  package-deb:
    name: package-deb / ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      REQUIRE_TRANSLATION: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: ubuntu-26.04
            image: ubuntu:26.04
          - name: debian-12
            image: debian:12
          - name: debian-13
            image: debian:13
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the packaging tools
        run: |
          apt-get update -qq
          apt-get install -y -qq bats build-essential debhelper gettext git locales shellcheck

      - name: Generate the French locale
        run: localedef -i fr_FR -f UTF-8 fr_FR.UTF-8

      - name: Build the Debian package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          cp ../euromillions_*.deb dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-package-${{ matrix.name }}
          path: dist/*.deb

  package-rpm:
    name: package-rpm / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: centos-stream9
            image: quay.io/centos/centos:stream9
          - name: centos-stream10
            image: quay.io/centos/centos:stream10
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install the packaging tools
        run: |
          dnf install -y epel-release
          dnf install -y bats gettext git glibc-langpack-fr rpm-build tar gzip
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the RPM
        env:
          REQUIRE_TRANSLATION: "1"
        run: |
          mkdir -p dist rpmbuild/SOURCES
          version=$(sed -n 's/^Version:[[:space:]]*\(.*\)/\1/p' packaging/rpm/euromillions.spec)
          git archive --format=tar.gz --prefix="euromillions-$version/" \
            --output="rpmbuild/SOURCES/euromillions-$version.tar.gz" HEAD
          rpmbuild -bb packaging/rpm/euromillions.spec --define "_topdir $PWD/rpmbuild"
          cp rpmbuild/RPMS/noarch/*.rpm dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-package-${{ matrix.name }}
          path: dist/*.rpm

  macos:
    name: macos / ${{ matrix.name }}
    runs-on: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the tools
        run: |
          brew install bash coreutils gettext bats shellcheck
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Run the test suite
        run: bats test test/shell

  freebsd:
    name: freebsd / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ["14.5", "15.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1
        with:
          release: ${{ matrix.name }}
          prepare: pkg install -y bash coreutils gettext bats-core git
          run: |
            export PATH=/usr/local/bin:$PATH
            export SHUF=gshuf
            tools/build-locales.sh
            bats test test/shell

  code-scanning:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Convert the shellcheck findings
        run: |
          shellcheck -f json1 euromillions.sh .githooks/commit-msg \
            tools/build-locales.sh > shellcheck.json || true
          python3 tools/shellcheck-sarif.py shellcheck.json shellcheck.sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - bats
      - markdown
      - package-deb
      - package-rpm
      - macos
      - freebsd
      - code-scanning
    runs-on: ubuntu-22.04
    steps:
      - name: Check that every job passed
        run: |
          [ "${{ needs.bats.result }}" = success ]
          [ "${{ needs.markdown.result }}" = success ]
          [ "${{ needs.package-deb.result }}" = success ]
          [ "${{ needs.package-rpm.result }}" = success ]
          [ "${{ needs.macos.result }}" = success ]
          [ "${{ needs.freebsd.result }}" = success ]
          [ "${{ needs.code-scanning.result }}" = success ] ||
            [ "${{ needs.code-scanning.result }}" = skipped ]

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set the version from the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          sed -i "1s/([^)]*)/($version)/" debian/changelog

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats build-essential debhelper gettext locales shellcheck

      - name: Generate the French locale
        run: sudo locale-gen fr_FR.UTF-8

      - name: Build the Debian package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          cp ../euromillions_*.deb dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-package
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream10
    steps:
      - name: Install the packaging tools
        run: |
          dnf config-manager --set-enabled crb
          dnf install -y git tar gzip rpm-build gettext
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set the version from the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          sed -i "s/^Version:.*/Version:        $version/" packaging/rpm/euromillions.spec

      - name: Build the RPM
        run: |
          mkdir -p dist rpmbuild/SOURCES
          version=${GITHUB_REF_NAME#v}
          git archive --format=tar.gz --prefix="euromillions-$version/" \
            --output="rpmbuild/SOURCES/euromillions-$version.tar.gz" HEAD
          rpmbuild -bb packaging/rpm/euromillions.spec --define "_topdir $PWD/rpmbuild"
          cp rpmbuild/RPMS/noarch/*.rpm dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-package
          path: dist/*.rpm

  publish:
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Check the packages token
        id: token
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the release notes
        run: python3 tools/changelog.py "$GITHUB_REF_NAME" > release-notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Notify the packages repository
        if: steps.token.outputs.present == 'yes'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          gh api repos/alaunay/packages/dispatches --method POST \
            -f event_type=release \
            -F "client_payload[repository]=$GITHUB_REPOSITORY" \
            -F "client_payload[tag]=$GITHUB_REF_NAME"

name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats gettext locales shellcheck

      - name: Generate the French locale
        run: sudo locale-gen fr_FR.UTF-8

      - name: Build the catalogues
        run: tools/build-locales.sh

      - name: Validate the metadata and the tools
        run: |
          python3 tools/check-metadata.py
          python3 -m py_compile tools/changelog.py tools/shellcheck-sarif.py

      - name: Run shellcheck
        run: shellcheck euromillions.sh .githooks/commit-msg tools/build-locales.sh

      - name: Run the test suite
        run: bats test test/shell

  package-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats build-essential debhelper gettext locales shellcheck

      - name: Generate the French locale
        run: sudo locale-gen fr_FR.UTF-8

      - name: Build the Debian package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          cp ../euromillions_*.deb dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-package
          path: dist/*.deb

  package-rpm:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream10
    steps:
      - name: Install the packaging tools
        run: |
          dnf config-manager --set-enabled crb
          dnf install -y git tar gzip rpm-build gettext
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the RPM
        run: |
          mkdir -p dist rpmbuild/SOURCES
          version=$(sed -n 's/^Version:[[:space:]]*\(.*\)/\1/p' packaging/rpm/euromillions.spec)
          git archive --format=tar.gz --prefix="euromillions-$version/" \
            --output="rpmbuild/SOURCES/euromillions-$version.tar.gz" HEAD
          rpmbuild -bb packaging/rpm/euromillions.spec --define "_topdir $PWD/rpmbuild"
          cp rpmbuild/RPMS/noarch/*.rpm dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-package
          path: dist/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the tools
        run: |
          brew install bash coreutils gettext bats shellcheck
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Run the test suite
        run: bats test test/shell

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1
        with:
          prepare: pkg install -y bash coreutils gettext
          run: |
            export PATH=/usr/local/bin:$PATH
            export SHUF=gshuf
            bash euromillions.sh | grep -q '^Numbers: '
            bash euromillions.sh --help | grep -q 'Languages: en fr'

  code-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Convert the shellcheck findings
        run: |
          shellcheck -f json1 euromillions.sh .githooks/commit-msg \
            tools/build-locales.sh > shellcheck.json || true
          python3 tools/shellcheck-sarif.py shellcheck.json shellcheck.sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck

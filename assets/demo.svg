<clipPath id="typing-1"><rect x="46" y="170" width="0" height="22"><animate attributeName="width" values="0;0;243.0;243.0" keyTimes="0;0.2098;0.3404;1" dur="11.371s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="720" height="306" rx="12" fill="#0d1117"/>
<rect width="720" height="40" rx="12" fill="#161b22"/>
<rect y="28" width="720" height="12" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#ff5f56"/>
<circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="20" r="6" fill="#27c93f"/>
<text x="360.0" y="25" fill="#8b949e" text-anchor="middle" font-size="12">euromillions</text>

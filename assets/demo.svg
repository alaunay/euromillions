<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img" aria-labelledby="title desc">
<title id="title">Terminal session running euromillions.sh</title>
<desc id="desc">The script prints five numbers and two stars, then prints the same draw in French.</desc>
<defs>
<clipPath id="typing-one"><rect x="46" y="58" width="0" height="22"><animate attributeName="width" values="0;0;153.0;153.0" keyTimes="0;0.0292;0.1071;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="typing-two"><rect x="46" y="170" width="0" height="22"><animate attributeName="width" values="0;0;243.0;243.0" keyTimes="0;0.2458;0.3696;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="720" height="306" rx="12" fill="#0d1117"/>
<rect width="720" height="40" rx="12" fill="#161b22"/>
<rect y="28" width="720" height="12" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#ff5f56"/>
<circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
<circle cx="64" cy="20" r="6" fill="#27c93f"/>
<text x="360.0" y="25" fill="#8b949e" text-anchor="middle" font-size="12">euromillions</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
<text x="28" y="72" fill="#39ff14">$</text>
<g clip-path="url(#typing-one)">
<text x="46" y="72" fill="#e6edf3">./euromillions.sh</text>
</g>
<rect x="46" y="59" width="8" height="19" fill="#c9d1d9" opacity="0"><animate attributeName="x" values="46;46;199.0;199.0" keyTimes="0;0.0292;0.1071;1" dur="12.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.0292;0.1071;1" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.1196" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="100" fill="#9aa4b2">Numbers:</text>
<text x="112" y="100" fill="#4d6bff">4 8 13 36 46</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.1488" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="128" fill="#9aa4b2">Stars:</text>
<text x="112" y="128" fill="#eebb05">3 12</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.2208" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="184" fill="#39ff14">$</text>
</g>
<g clip-path="url(#typing-two)">
<text x="46" y="184" fill="#e6edf3">./euromillions.sh --lang fr</text>
</g>
<rect x="46" y="171" width="8" height="19" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.2208" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="x" values="46;46;289.0;289.0" keyTimes="0;0.2458;0.3696;1" dur="12.0s" repeatCount="indefinite"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.3821" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="212" fill="#9aa4b2">Numéros:</text>
<text x="112" y="212" fill="#4d6bff">17 19 20 27 48</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.4113" dur="12.0s" calcMode="discrete" repeatCount="indefinite"/>
<text x="28" y="240" fill="#9aa4b2">Étoiles:</text>
<text x="112" y="240" fill="#eebb05">5 12</text>
</g>
</g>
</svg>

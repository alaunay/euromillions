name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck gettext locales

      - name: Generate the French locale
        run: sudo locale-gen fr_FR.UTF-8

      - name: Build the catalogues
        run: tools/build-locales.sh

      - name: Run shellcheck
        run: shellcheck euromillions.sh .githooks/commit-msg tools/build-locales.sh

      - name: Run the test suite
        run: bats test/euromillions.bats

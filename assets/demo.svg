<text x="28" y="184" fill="#39ff14">$</text>
</g>
<g clip-path="url(#typing-1)">
<text x="46" y="184" fill="#e6edf3">./euromillions.sh --lang fr</text>
</g>
<rect x="46" y="171" width="8" height="19" fill="#e6edf3" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1834;1" dur="11.371s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="x" values="46;46;289.0;289.0" keyTimes="0;0.2098;0.3404;1" dur="11.371s" repeatCount="indefinite"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.3536" dur="11.371s" repeatCount="indefinite" calcMode="discrete"/>

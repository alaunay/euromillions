<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" role="img" aria-labelledby="title desc">
<title id="title">Terminal session</title>
<desc id="desc">A terminal types a command, prints the result, then types another command.</desc>
<defs>
